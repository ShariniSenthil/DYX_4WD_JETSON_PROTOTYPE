# rosbag2 QoS overrides for the DYX 4WD marking stack.
#
# TRANSIENT_LOCAL topics are published once at prepare/start, before the
# auto-recorder subscribes. Default ros2 bag record is VOLATILE and misses them.
# BEST_EFFORT publishers are incompatible with a RELIABLE recorder subscription.
#
# Passed as: ros2 bag record --qos-profile-overrides-path <this>

# --- latched path / sequencer (RELIABLE + TRANSIENT_LOCAL) ---
/nav_path:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
/mission_waypoints:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: transient_local
